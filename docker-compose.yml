version: '3.8'

services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flipzy-backend
    restart: unless-stopped
    # Memory limits (enforced in Docker Swarm mode, informational for regular docker-compose)
    # For regular docker-compose, set via: docker update --memory=1.2g flipzy-backend
    # Leaves headroom: ~1.5GB free for system + frontend + spikes
    deploy:
      resources:
        limits:
          memory: 1.2G
        reservations:
          memory: 800M
    working_dir: /var/www/html
    volumes:
      # Storage configuration:
      # - Local development: Uses ./storage (default)
      # - Production: Uncomment the DigitalOcean volume mount below and comment out ./storage
      
      # Local development (default)
      #- ./storage:/var/www/html/storage
      
      # Production: DigitalOcean volume for images (uncomment for production)
      - /mnt/volume_atl1_01/app/public:/var/www/html/storage/app/public
      - ./storage/app/private:/var/www/html/storage/app/private
      - ./storage/framework:/var/www/html/storage/framework
      - ./storage/logs:/var/www/html/storage/logs
      
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./.env:/var/www/html/.env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-flipzy}
      - DB_USERNAME=${DB_USERNAME:-flipzy}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
      - CACHE_DRIVER=${CACHE_DRIVER:-redis}
      - SESSION_DRIVER=${SESSION_DRIVER:-redis}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - SEED_DATABASE=${SEED_DATABASE:-false}
      - GENERATE_SWAGGER=${GENERATE_SWAGGER:-true}
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flipzy-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: flipzy-mysql
    restart: unless-stopped
    # Memory limits (enforced in Docker Swarm mode, informational for regular docker-compose)
    # For regular docker-compose, set via: docker update --memory=2.5g flipzy-mysql
    # MySQL buffer pool: 1.5GB (leaves ~1GB for connections, buffers, overhead)
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 2G
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-flipzy}
      - MYSQL_USER=${DB_USERNAME:-flipzy}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/backups:/backups
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"  # Localhost only - use SSH tunnel for external access
    networks:
      - flipzy-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --max_allowed_packet=256M

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: flipzy-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 400mb --maxmemory-policy allkeys-lru
    # Memory limits (enforced in Docker Swarm mode, informational for regular docker-compose)
    # For regular docker-compose, set via: docker update --memory=500m flipzy-redis
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 400M
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"  # Localhost only - use SSH tunnel for external access
    networks:
      - flipzy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin removed - using DataGrip for database management instead

  # Redis Commander - Redis Management Tool
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: flipzy-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    networks:
      - flipzy-network
    profiles:
      - tools  # Only start with --profile tools

volumes:
  redis_data:
    driver: local

networks:
  flipzy-network:
    driver: bridge
