[program:laravel-horizon]
process_name=%(program_name)s
command=php /var/www/html/artisan horizon
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/horizon.log
stopwaitsecs=3600
; Horizon disabled by default in dev - enable manually if needed
; To enable: supervisorctl start laravel-horizon

